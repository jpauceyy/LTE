# Generated by "npm run cms:sync". Edit scripts/cms-sync.js rather than this file.
backend:
  name: github
  repo: jpauceyy/LTE
  branch: main
  base_url: https://learntryearn.vercel.app
  auth_endpoint: api/auth
local_backend: true          # "npm run cms:local" + "npm run dev" to edit without logging in
publish_mode: simple
media_folder: assets/img/uploads
public_folder: /assets/img/uploads
site_url: "https://www.YOUR-DOMAIN.com"
display_url: "https://www.YOUR-DOMAIN.com"

collections:
